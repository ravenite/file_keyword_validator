services:
  file_keyword_validator.text_extractor:
    class: Drupal\file_keyword_validator\Service\TextExtractorService
    arguments: ['@logger.factory']

  file_keyword_validator.scanner:
    class: Drupal\file_keyword_validator\Service\KeywordScannerService
    arguments:
      - '@config.factory'
      - '@file_keyword_validator.text_extractor'
      - '@cache.default'
      - '@entity_type.manager'
      - '@content_moderation.moderation_information'
      - '@database'
